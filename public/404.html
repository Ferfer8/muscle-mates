<!DOCTYPE html>
<!-- Shown for any address that doesn't exist. Plain HTML with its own small stylesheet, so it works even if the scripts fail.
     Paths start with "/" because the page can be shown at any depth, e.g. /a/b/c. -->
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Page not found | Muscle Mates</title>
    <link rel="icon" type="image/x-icon" href="/assets/logo/logo.png">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            color: #282828;
            background: #f7faff;
        }

        main {
            width: 100%;
            max-width: 460px;
            padding: 40px 32px;
            box-sizing: border-box;
            text-align: center;
            background: #fff;
            border: 1px solid #e5e0f7;
            border-radius: 24px;
            box-shadow: 0 10px 40px rgba(36, 0, 144, .12);
        }

        img {
            width: 96px;
            height: auto;
        }

        .code {
            margin: 8px 0 0;
            font-size: 64px;
            font-weight: bold;
            line-height: 1;
            color: #240090;
        }

        h1 {
            margin: 12px 0 8px;
            font-size: 22px;
            color: #240090;
        }

        p {
            margin: 0 0 24px;
            font-size: 15px;
            line-height: 1.5;
            color: #5b5b5b;
        }

        a {
            display: inline-block;
            padding: 12px 28px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            color: #fff;
            background: #240090;
            border-radius: 24px;
        }

        a:hover {
            background: #190061;
        }

        a:focus-visible {
            outline: 2px solid #3500D3;
            outline-offset: 3px;
        }
    </style>
</head>

<body>
    <main>
        <img src="/assets/logo/logo.png" alt="Muscle Mates logo">
        <p class="code" aria-hidden="true">404</p>
        <h1>Page not found</h1>
        <p>Looks like this page skipped leg day. The address may be wrong, or the page may have moved.</p>
        <a href="/">Back to Muscle Mates</a>
    </main>
</body>

</html>
